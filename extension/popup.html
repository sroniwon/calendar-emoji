<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Calendar Emoji Auto-Tagger</title>
<style>
  /* ── 테마 CSS 변수 ── */
  :root {
    --bg: #2F6B3F; --card: rgba(0,0,0,.15); --card-solid: #256332; --hover: rgba(0,0,0,.22);
    --accent: #F7C85C; --text: #FFF6C0; --muted: #7FB77E; --faint: rgba(127,183,126,.4);
    --border: rgba(255,246,192,.12); --accent-soft: rgba(247,200,92,.15);
    --toggle-on: #F7C85C; --toggle-knob: #2F6B3F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 340px; font-family: 'Google Sans','Noto Sans KR','Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); transition: background .3s, color .3s; }

  /* ── 헤더 ── */
  .header { padding:16px 18px 14px; display:flex; align-items:center; gap:12px; }
  .header-icon { width:40px; height:40px; border-radius:12px; flex-shrink:0; overflow:hidden; }
  .header-icon img { width:100%; height:100%; object-fit:contain; }
  .header-text { flex:1; min-width:0; }
  .header h1 { font-size:15px; font-weight:700; letter-spacing:-.3px; }
  .header-meta { display:flex; align-items:center; gap:8px; margin-top:3px; }
  .header-meta .badge { font-size:10px; color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:6px; font-weight:600; }
  .header-meta .stat { font-size:10px; color:var(--muted); }

  .header-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .lang-btn { background:rgba(255,255,255,.1); color:var(--text); border:none; border-radius:8px; padding:5px 8px; font-size:10px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s; letter-spacing:.5px; }
  .lang-btn:hover { background:rgba(255,255,255,.18); }

  /* 토글 (미니) */
  .mini-switch { position:relative; width:36px; height:20px; flex-shrink:0; }
  .mini-switch input { opacity:0; width:0; height:0; }
  .mini-slider { position:absolute; inset:0; background:rgba(0,0,0,.2); border-radius:20px; cursor:pointer; transition:background .2s; }
  .mini-slider::before { content:""; position:absolute; width:16px; height:16px; left:2px; top:2px; background:rgba(255,255,255,.4); border-radius:50%; transition:all .2s; }
  .mini-switch input:checked + .mini-slider { background:var(--toggle-on); }
  .mini-switch input:checked + .mini-slider::before { transform:translateX(16px); background:var(--toggle-knob); }

  /* ── 구분선 ── */
  .divider { height:1px; background:linear-gradient(90deg,transparent,var(--border),transparent); margin:0 18px; }

  /* ── 섹션 공통 ── */
  .section { padding:14px 18px; }
  .section-label { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.8px; text-transform:uppercase; margin-bottom:10px; }

  /* ── 테마 선택 ── */
  .theme-section { padding:10px 18px 6px; }
  .theme-row { display:flex; align-items:center; gap:8px; }
  .theme-dot { width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all .15s; position:relative; display:flex; align-items:center; justify-content:center; font-size:16px; background:none !important; }
  .theme-dot:hover { transform:scale(1.2); }
  .theme-dot.active { border-color:var(--accent); }

  /* ── 미리보기 ── */
  .preview-wrap { display:flex; gap:8px; }
  .preview-input { flex:1; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-size:13px; color:var(--text); font-family:inherit; outline:none; transition:border-color .2s; }
  .preview-input::placeholder { color:var(--muted); opacity:.6; }
  .preview-input:focus { border-color:var(--accent); }
  .preview-btn { background:var(--accent); color:var(--bg); border:none; border-radius:10px; padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; transition:opacity .15s; }
  .preview-btn:hover { opacity:.85; }
  .preview-result { margin-top:8px; min-height:22px; font-size:14px; font-weight:600; color:var(--accent); }
  .preview-empty { color:var(--muted); font-size:11px; font-weight:400; }

  /* ── 커스텀 규칙 ── */
  .custom-form { display:flex; gap:6px; margin-bottom:10px; }
  .emoji-pick-wrap { position:relative; flex-shrink:0; }
  .emoji-pick-btn { width:42px; height:38px; background:var(--card); border:1px solid var(--border); border-radius:10px; font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; transition:all .15s; }
  .emoji-pick-btn:hover, .emoji-pick-btn.active { border-color:var(--accent); background:var(--hover); }

  .emoji-picker { display:none; position:absolute; top:44px; left:0; z-index:100; width:260px; background:var(--card-solid); border:1px solid var(--border); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.35); padding:10px; }
  .emoji-picker.show { display:block; animation:fadeUp .15s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
  .emoji-picker-tabs { display:flex; gap:1px; margin-bottom:8px; background:rgba(0,0,0,.1); border-radius:8px; padding:2px; }
  .emoji-tab { flex:1; background:none; border:none; font-size:14px; padding:4px 0; cursor:pointer; border-radius:6px; opacity:.4; transition:all .12s; text-align:center; }
  .emoji-tab:hover { opacity:.7; }
  .emoji-tab.active { opacity:1; background:var(--accent-soft); }
  .emoji-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; max-height:150px; overflow-y:auto; }
  .emoji-cell { font-size:18px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; transition:background .1s; }
  .emoji-cell:hover { background:var(--accent-soft); }
  .emoji-grid::-webkit-scrollbar { width:3px; }
  .emoji-grid::-webkit-scrollbar-track { background:transparent; }
  .emoji-grid::-webkit-scrollbar-thumb { background:var(--faint); border-radius:3px; }

  .custom-keyword { flex:1; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-size:12px; color:var(--text); font-family:inherit; outline:none; transition:border-color .2s; }
  .custom-keyword::placeholder { color:var(--muted); opacity:.6; }
  .custom-keyword:focus { border-color:var(--accent); }
  .custom-add { width:38px; height:38px; background:var(--accent); color:var(--bg); border:none; border-radius:10px; font-size:18px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:opacity .15s; flex-shrink:0; }
  .custom-add:hover { opacity:.85; }

  .custom-list { max-height:130px; overflow-y:auto; }
  .custom-item { display:flex; align-items:center; gap:8px; padding:7px 10px; margin-bottom:4px; background:var(--card); border-radius:10px; transition:background .12s; }
  .custom-item:hover { background:var(--hover); }
  .custom-item-emojis { font-size:16px; flex-shrink:0; }
  .custom-item-keyword { flex:1; font-size:12px; color:var(--text); font-weight:500; }
  .custom-del { background:none; border:none; color:var(--faint); font-size:12px; cursor:pointer; padding:4px 6px; border-radius:6px; transition:all .12s; flex-shrink:0; }
  .custom-del:hover { color:#ff6b6b; background:rgba(255,107,107,.15); }
  .custom-empty { font-size:11px; color:var(--faint); text-align:center; padding:12px 0; }
  .custom-list::-webkit-scrollbar { width:3px; }
  .custom-list::-webkit-scrollbar-track { background:transparent; }
  .custom-list::-webkit-scrollbar-thumb { background:var(--faint); border-radius:3px; }

  /* ── 카테고리 접기 ── */
  .cat-section { padding:6px 18px 8px; }
  .cat-toggle { background:none; border:none; color:var(--faint); font-size:10px; cursor:pointer; font-family:inherit; padding:4px 0; display:flex; align-items:center; gap:5px; font-weight:600; letter-spacing:.3px; transition:color .15s; }
  .cat-toggle:hover { color:var(--accent); }
  .cat-list { display:none; background:var(--card); border-radius:12px; padding:10px 14px; margin-top:6px; max-height:180px; overflow-y:auto; }
  .cat-list.show { display:block; animation:fadeUp .15s ease; }
  .cat-item { font-size:11px; padding:3px 0; color:var(--muted); }
  .cat-item span { margin-right:6px; font-size:13px; }
  .cat-list::-webkit-scrollbar { width:3px; }
  .cat-list::-webkit-scrollbar-track { background:transparent; }
  .cat-list::-webkit-scrollbar-thumb { background:var(--faint); border-radius:3px; }

  /* ── 푸터 ── */
  .footer { padding:8px 18px 14px; text-align:center; font-size:9px; color:var(--faint); letter-spacing:.3px; }
  .footer .bmc-link { color:var(--muted); text-decoration:none; transition:color .15s; margin-left:4px; }
  .footer .bmc-link:hover { color:var(--accent); }
  .footer .footer-sep { opacity:.5; margin:0 2px; }
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div class="header-icon"><img src="icon48.png" alt="Cal Emoji" /></div>
  <div class="header-text">
    <h1>Cal Emoji</h1>
    <div class="header-meta">
      <span class="badge" id="emoji-count-badge" data-i18n-template="badgeCount">0회 적용</span>
      <span class="stat" id="cat-count-badge">178 rules</span>
    </div>
  </div>
  <div class="header-actions">
    <label class="mini-switch" id="toggle-label" title="Auto-emoji On/Off">
      <input type="checkbox" id="toggle" checked />
      <span class="mini-slider"></span>
    </label>
    <button class="lang-btn" id="lang-btn">KO</button>
  </div>
</div>

<div class="divider"></div>

<!-- 테마 선택 -->
<div class="theme-section">
  <div class="section-label" data-i18n="themeTitle">THEME</div>
  <div class="theme-row" id="theme-row"></div>
</div>

<div class="divider"></div>

<!-- 미리보기 -->
<div class="section">
  <div class="section-label" data-i18n="previewTitle">EMOJI PREVIEW</div>
  <div class="preview-wrap">
    <input class="preview-input" id="preview-input" type="text" data-i18n-placeholder="previewPlaceholder" placeholder="예: 팀 미팅, 운동, 점심 약속..." />
    <button class="preview-btn" id="preview-btn" data-i18n="previewBtn">확인</button>
  </div>
  <div class="preview-result" id="preview-result"></div>
</div>

<div class="divider"></div>

<!-- 커스텀 규칙 -->
<div class="section">
  <div class="section-label" data-i18n="customTitle">MY CUSTOM RULES</div>
  <div class="custom-form">
    <div class="emoji-pick-wrap">
      <div class="emoji-pick-btn" id="custom-emoji-btn">😀</div>
      <div class="emoji-picker" id="emoji-picker"></div>
    </div>
    <input class="custom-keyword" id="custom-keyword" type="text" data-i18n-placeholder="customKeywordPh" placeholder="키워드 입력..." />
    <button class="custom-add" id="custom-add-btn">+</button>
  </div>
  <div class="custom-list" id="custom-list"></div>
  <div class="custom-empty" id="custom-empty" data-i18n="customEmpty">아직 추가된 규칙이 없습니다</div>
</div>

<div class="divider"></div>

<!-- 카테고리 -->
<div class="cat-section">
  <button class="cat-toggle" id="cat-toggle" data-i18n="catShow">▶ 지원하는 이모지 카테고리 보기</button>
  <div class="cat-list" i
